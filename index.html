<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda de turnos</title>
<script src="https://cdn.jsdelivr.net/npm/libphonenumber-js/bundle/libphonenumber-js.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root{
  --paper:#F7F4EE;
  --paper-raised:#FFFFFF;
  --ink:#2B2B26;
  --ink-soft:#6B6559;
  --line:#E1DACB;
  --teal:#3F6357;
  --teal-deep:#2C4740;
  --clay:#C1704F;
  --sage:#B9C4A9;
  --today-wash:#FBF0E9;
  --radius:10px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}

.app{
  max-width:1080px;
  margin:0 auto;
  padding:28px 20px 80px;
}

/* ---------- Header ---------- */
.masthead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:22px;
  flex-wrap:wrap;
  gap:8px;
}
.masthead h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:32px;
  letter-spacing:-0.01em;
  margin:0;
}
.masthead .today-tag{
  font-family:'DM Mono', monospace;
  font-size:12px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:.06em;
}

/* ---------- Status banner (setup / connection issues) ---------- */
.status-banner{
  border-radius:8px;
  padding:12px 16px;
  font-size:13.5px;
  margin-bottom:20px;
  line-height:1.5;
}
.status-banner code{
  font-family:'DM Mono', monospace;
  background:rgba(0,0,0,.08);
  padding:1px 5px;
  border-radius:4px;
}
.status-banner.setup{
  background:#FBF0E9;
  border:1px solid #E8C8B4;
  color:var(--teal-deep);
}
.status-banner.error{
  background:#FBEAE5;
  border:1px solid #E8B8AC;
  color:#8C3423;
}
.banner-retry{
  background:var(--teal);
  color:#fff;
  border:none;
  border-radius:5px;
  padding:5px 12px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  margin-left:8px;
}
.banner-retry:hover{background:var(--teal-deep);}

/* ---------- Loading states ---------- */
.spinner{
  display:inline-block;
  width:12px; height:12px;
  border:2px solid rgba(0,0,0,.15);
  border-top-color:var(--teal);
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
}
.spinner-lg{
  width:28px; height:28px;
  border-width:3px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.sync-indicator{
  display:flex;
  align-items:center;
  gap:6px;
  font-family:'DM Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:.04em;
}

.initial-loading{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:80px 20px;
  color:var(--ink-soft);
  font-size:14px;
}
.initial-loading.hidden{display:none;}

/* ---------- Layout ---------- */
.layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:24px;
  align-items:start;
}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;}
  .appt-row-bottom{padding-left:0;}
  .app{padding:18px 14px 60px;}
  .card{padding:16px;}
  .masthead h1{font-size:26px;}
  .appt-row-top{flex-wrap:wrap; row-gap:6px;}
  .appt-name{min-width:140px;}
  .week-timetable-wrap{-webkit-overflow-scrolling:touch;}
}
@media (max-width:480px){
  .row2{grid-template-columns:1fr;}
  .price-group select{width:80px;}
  .masthead{flex-direction:column; align-items:flex-start;}
  .tabs{overflow-x:auto; flex-wrap:nowrap;}
  .tab{white-space:nowrap;}
}

/* ---------- Add form card ---------- */
.card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
}
.card + .card{margin-top:18px;}
.card h2{
  font-family:'Fraunces', serif;
  font-size:17px;
  font-weight:600;
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.card h2::before{
  content:'';
  width:7px;height:7px;
  background:var(--clay);
  border-radius:50%;
  display:inline-block;
}

.field{margin-bottom:12px;}
.field label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-soft);
  margin-bottom:5px;
  font-weight:600;
}
.field input, .field textarea, .field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:6px;
  padding:9px 10px;
  font-family:'Inter',sans-serif;
  font-size:14px;
  background:var(--paper);
  color:var(--ink);
}
.field input:focus, .field textarea:focus, .field select:focus{
  outline:none;
  border-color:var(--teal);
  background:#fff;
}
.field textarea{resize:vertical; min-height:50px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.price-group{display:flex; gap:6px;}
.price-group input{flex:1; min-width:0; font-size:15px;}
.price-group select{width:78px; flex-shrink:0; padding-left:6px; padding-right:6px;}

.btn-primary{
  width:100%;
  background:var(--teal);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:11px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  transition:background .15s ease;
  margin-top:4px;
}
.btn-primary:hover{background:var(--teal-deep);}
.btn-primary:active{transform:translateY(1px);}
.form-msg{
  font-size:12.5px;
  color:var(--teal-deep);
  margin-top:8px;
  min-height:14px;
}

/* ---------- Nav tabs ---------- */
.tabs{
  display:flex;
  gap:6px;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
}
.tab{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-soft);
  background:none;
  border:none;
  padding:9px 4px 11px;
  cursor:pointer;
  position:relative;
  margin-right:14px;
}
.tab.active{color:var(--ink);}
.tab.active::after{
  content:'';
  position:absolute;
  left:0; right:0; bottom:-1px;
  height:2px;
  background:var(--clay);
}

/* ---------- Agenda list (Hoy / Próximos) ---------- */
.day-block{margin-bottom:22px;}
.day-block-header{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:8px;
}
.day-block-header .day-name{
  font-family:'Fraunces', serif;
  font-size:19px;
  font-weight:600;
  text-transform:capitalize;
}
.day-block-header .day-date{
  font-family:'DM Mono', monospace;
  font-size:12px;
  color:var(--ink-soft);
}
.day-block-header .day-count{
  margin-left:auto;
  font-size:11px;
  font-family:'DM Mono', monospace;
  color:var(--ink-soft);
}

.appt-row{
  display:flex;
  flex-direction:column;
  gap:6px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-left:4px solid var(--teal);
  border-radius:8px;
  padding:11px 14px;
  margin-bottom:8px;
}
.appt-row.is-today{background:var(--today-wash);}
.appt-row-top{
  display:flex;
  align-items:center;
  gap:14px;
}
.appt-time{
  font-family:'DM Mono', monospace;
  font-size:13px;
  font-weight:600;
  color:var(--teal-deep);
  min-width:98px;
}
.appt-name{
  font-weight:600;
  font-size:14.5px;
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
}
.appt-dot{
  width:9px; height:9px;
  border-radius:50%;
  flex-shrink:0;
  display:inline-block;
}
.appt-warn{
  font-size:11px;
  font-weight:700;
  color:#B0432E;
  white-space:nowrap;
  background:#FBEAE5;
  padding:2px 6px;
  border-radius:4px;
}
.appt-row-bottom{
  display:flex;
  flex-wrap:wrap;
  gap:6px 16px;
  padding-left:112px;
}
.appt-meta-item{
  font-size:12.5px;
  color:var(--ink-soft);
}
.appt-meta-notes{font-style:italic;}
.appt-actions{display:flex; gap:6px;}
.icon-btn{
  background:none;
  border:none;
  cursor:pointer;
  font-size:14px;
  color:var(--ink-soft);
  padding:4px 6px;
  border-radius:4px;
}
.icon-btn:hover{background:var(--paper); color:var(--ink);}

.empty-state{
  color:var(--ink-soft);
  font-size:13.5px;
  padding:20px 4px;
  font-style:italic;
}

/* ---------- Week view ---------- */
.week-nav{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}
.week-nav button{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 12px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13px;
}
.week-nav button:hover{border-color:var(--teal);}
.week-range{
  font-family:'DM Mono', monospace;
  font-size:13px;
  color:var(--ink-soft);
}

.day-nav{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}
.day-nav button{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 12px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:14px;
}
.day-nav button:hover{border-color:var(--teal);}
.day-nav input[type="date"]{
  border:1px solid var(--line);
  border-radius:6px;
  padding:7px 10px;
  font-family:'DM Mono', monospace;
  font-size:13px;
  background:var(--paper-raised);
  color:var(--ink);
}

/* ---------- Week view: hourly timetable ---------- */
.week-timetable-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--paper-raised);
}
.week-timetable{
  display:grid;
  grid-template-columns:52px repeat(7, minmax(112px,1fr));
  min-width:880px;
}
.tt-corner{
  position:sticky; top:0; left:0; z-index:3;
  background:var(--paper-raised);
  border-bottom:1px solid var(--line);
}
.tt-day-head{
  position:sticky; top:0; z-index:2;
  background:var(--paper-raised);
  border-bottom:1px solid var(--line);
  border-left:1px solid var(--line);
  padding:8px 4px;
  text-align:center;
}
.tt-day-head.is-today{background:var(--today-wash);}
.tt-day-head .dname{
  font-family:'DM Mono', monospace;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--ink-soft);
}
.tt-day-head .dnum{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:16px;
  margin-top:1px;
}
.tt-hour-col{
  position:relative;
}
.tt-hour-label{
  position:absolute;
  right:6px;
  transform:translateY(-7px);
  font-family:'DM Mono', monospace;
  font-size:10px;
  color:var(--ink-soft);
}
.tt-day-col{
  position:relative;
  border-left:1px solid var(--line);
  cursor:pointer;
}
.tt-day-col.is-today{background:var(--today-wash);}
.tt-day-col:hover{background:#F2EEE3;}
.tt-day-col.is-today:hover{background:#F7E5D8;}
.tt-now-line{
  position:absolute;
  left:0; right:0;
  height:0;
  border-top:2px solid var(--clay);
  z-index:1;
  pointer-events:none;
}
.tt-appt{
  position:absolute;
  background:var(--teal);
  border-left:3px solid var(--teal-deep);
  border-radius:5px;
  padding:3px 5px;
  overflow:hidden;
  cursor:pointer;
  z-index:2;
  box-sizing:border-box;
}
.tt-appt.is-today{box-shadow:inset 0 0 0 2px rgba(0,0,0,.35);}
.tt-appt.tt-overlap{outline:2px dashed #B0432E; outline-offset:1px;}
.tt-appt:hover{filter:brightness(1.08);}
.tt-appt-time{
  font-family:'DM Mono', monospace;
  font-size:10px;
  font-weight:600;
  color:rgba(255,255,255,.9);
  line-height:1.2;
}
.tt-appt-name{
  font-size:11.5px;
  font-weight:600;
  color:#fff;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tt-del{
  position:absolute;
  top:2px; right:2px;
  background:rgba(255,255,255,.25);
  border:none;
  color:#fff;
  font-size:9px;
  line-height:1;
  padding:2px 4px;
  border-radius:3px;
  cursor:pointer;
}
.tt-del:hover{background:rgba(255,255,255,.5);}
.tt-warn{
  position:absolute;
  top:2px; left:2px;
  font-size:9px;
  line-height:1;
  background:#fff;
  color:#B0432E;
  padding:1px 3px;
  border-radius:3px;
  font-weight:700;
}
.week-hint{
  font-size:12px;
  color:var(--ink-soft);
  margin-bottom:10px;
  font-style:italic;
}

/* ---------- Estadísticas ---------- */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
  gap:12px;
}
.stats-grid-compact{
  grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
}
.stat-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-top:3px solid var(--teal);
  border-radius:8px;
  padding:14px 16px;
}
.stat-value{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:24px;
  line-height:1.1;
}
.stat-label{
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:4px;
  text-transform:uppercase;
  letter-spacing:.03em;
}

.wd-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.wd-label{
  font-family:'DM Mono', monospace;
  font-size:11px;
  text-transform:uppercase;
  color:var(--ink-soft);
  width:32px;
  flex-shrink:0;
}
.wd-bar-track{
  flex:1;
  background:var(--paper);
  border-radius:5px;
  height:16px;
  overflow:hidden;
}
.wd-bar-fill{
  height:100%;
  background:var(--teal);
  border-radius:5px;
  min-width:2px;
}
.wd-count{
  font-family:'DM Mono', monospace;
  font-size:12px;
  color:var(--ink-soft);
  width:20px;
  text-align:right;
  flex-shrink:0;
}

/* ---------- misc ---------- */
.hidden{display:none !important;}
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <h1>Agenda de turnos</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="today-tag" id="todayTag"></span>
      <span id="syncIndicator" class="sync-indicator hidden">
        <span class="spinner"></span> Sincronizando…
      </span>
      <button id="btnRefresh" class="banner-retry" style="margin-left:0;">↻ Actualizar</button>
    </div>
  </div>

  <div id="statusBanner" class="status-banner hidden"></div>

  <div id="initialLoading" class="initial-loading">
    <span class="spinner spinner-lg"></span>
    <span>Cargando la agenda…</span>
  </div>

  <div class="layout hidden" id="mainLayout">
    <!-- Sidebar: quick add -->
    <div>
      <div class="card">
        <h2>Nuevo turno</h2>
        <div class="field">
          <label for="fName">Paciente</label>
          <input type="text" id="fName" placeholder="Nombre y apellido">
        </div>
        <div class="field">
          <label for="fDate">Día</label>
          <input type="date" id="fDate">
        </div>
        <div class="row2">
          <div class="field">
            <label for="fStart">Hora de inicio</label>
            <input type="time" id="fStart">
          </div>
          <div class="field">
            <label for="fDuration">Duración</label>
            <select id="fDuration"></select>
          </div>
        </div>
        <div class="field">
          <label for="fPhone">Teléfono</label>
          <input type="tel" id="fPhone" placeholder="11 5555-5555">
        </div>
        <div class="field">
          <label for="fPrice">Valor consulta</label>
          <div class="price-group">
            <select id="fCurrency">
              <option value="ARS" selected>$</option>
              <option value="USD">US$</option>
            </select>
            <input type="number" id="fPrice" placeholder="0" min="0" step="0.01">
          </div>
        </div>
        <div class="field">
          <label for="fNotes">Notas</label>
          <textarea id="fNotes" placeholder="Ej: primera sesión, modalidad online..."></textarea>
        </div>
        <button class="btn-primary" id="btnAdd">Agregar turno</button>
        <div class="form-msg" id="formMsg"></div>
      </div>
    </div>

    <!-- Main: views -->
    <div>
      <div class="tabs">
        <button class="tab active" data-view="hoy">Hoy</button>
        <button class="tab" data-view="manana">Mañana</button>
        <button class="tab" data-view="otro">Otro día</button>
        <button class="tab" data-view="semana">Semana</button>
        <button class="tab" data-view="estadisticas">Estadísticas</button>
      </div>

      <div id="viewHoy" class="view-panel"></div>
      <div id="viewManana" class="view-panel hidden"></div>
      <div id="viewOtro" class="view-panel hidden">
        <div class="day-nav">
          <button id="otroPrev">&larr;</button>
          <input type="date" id="otroDatePicker">
          <button id="otroNext">&rarr;</button>
        </div>
        <div id="otroContent"></div>
      </div>
      <div id="viewSemana" class="view-panel hidden">
        <div class="week-nav">
          <button id="weekPrev">&larr; anterior</button>
          <span class="week-range" id="weekRange"></span>
          <button id="weekNext">siguiente &rarr;</button>
        </div>
        <p class="week-hint">Tocá un espacio libre en la grilla para cargar un turno en ese horario.</p>
        <div class="week-timetable-wrap">
          <div class="week-timetable" id="weekTimetable"></div>
        </div>
      </div>
      <div id="viewEstadisticas" class="view-panel hidden">
        <div class="week-nav">
          <button id="statsPrev">&larr; anterior</button>
          <span class="week-range" id="statsMonthLabel"></span>
          <button id="statsNext">siguiente &rarr;</button>
        </div>
        <div id="statsContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
let appointments = [];
let weekOffset = 0; // 0 = current week
let editingId = null;

const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_CORTOS = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// Palette of distinct, muted colors. Each patient gets a consistent color
// (derived from their name) so the same person reads the same color across views.
const PALETTE = [
  { bg:'#3F6357', line:'#2C4740' }, // teal
  { bg:'#C1704F', line:'#96482E' }, // clay
  { bg:'#7C6A9C', line:'#564A72' }, // plum
  { bg:'#B98A2E', line:'#8C6817' }, // ochre
  { bg:'#4C7A94', line:'#33566B' }, // slate blue
  { bg:'#6E8C5B', line:'#4C6640' }, // moss
  { bg:'#B15A6C', line:'#853F4C' }, // rose
];

function hashStr(str){
  let h = 0;
  for(let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function colorForName(name){
  const key = (name || '').trim().toLowerCase();
  const idx = hashStr(key) % PALETTE.length;
  return PALETTE[idx];
}

function appointmentsOverlap(a, b){
  const aStart = timeToMinutes(a.timeStart), aEnd = timeToMinutes(a.timeEnd);
  const bStart = timeToMinutes(b.timeStart), bEnd = timeToMinutes(b.timeEnd);
  return aStart < bEnd && bStart < aEnd;
}

function findOverlaps(date, timeStart, timeEnd, excludeId){
  const startM = timeToMinutes(timeStart), endM = timeToMinutes(timeEnd);
  return appointments.filter(a =>
    a.date === date &&
    a.id !== excludeId &&
    timeToMinutes(a.timeStart) < endM &&
    startM < timeToMinutes(a.timeEnd)
  );
}

// Tags each appointment in a same-day list with `_overlap: true` if it collides with another.
function markOverlaps(list){
  return list.map(a => ({
    ...a,
    _overlap: list.some(b => b.id !== a.id && appointmentsOverlap(a, b))
  }));
}

// Lays out same-day appointments into side-by-side columns wherever they overlap,
// so overlapping turnos are visually distinguishable in the week timetable.
function layoutDayAppointments(dayAppts){
  const sorted = dayAppts.slice().sort((a,b) => timeToMinutes(a.timeStart) - timeToMinutes(b.timeStart));
  const result = [];
  let i = 0;
  while(i < sorted.length){
    let clusterEnd = timeToMinutes(sorted[i].timeEnd);
    const cluster = [sorted[i]];
    let j = i + 1;
    while(j < sorted.length && timeToMinutes(sorted[j].timeStart) < clusterEnd){
      cluster.push(sorted[j]);
      clusterEnd = Math.max(clusterEnd, timeToMinutes(sorted[j].timeEnd));
      j++;
    }
    const columns = [];
    const clusterPlacements = [];
    cluster.forEach(appt => {
      const startM = timeToMinutes(appt.timeStart);
      const endM = timeToMinutes(appt.timeEnd);
      let col = -1;
      for(let c=0; c<columns.length; c++){
        if(columns[c] <= startM){ columns[c] = endM; col = c; break; }
      }
      if(col === -1){ columns.push(endM); col = columns.length - 1; }
      clusterPlacements.push({ appt, col });
    });
    const colsInCluster = columns.length;
    clusterPlacements.forEach(p => result.push({ appt: p.appt, col: p.col, colsInCluster }));
    i = j;
  }
  return result;
}

function pad(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayStr(){ return toDateStr(new Date()); }
function parseLocalDate(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

const DEFAULT_DURATION = 40;

function timeToMinutes(timeStr){
  const [h,m] = timeStr.split(':').map(Number);
  return h*60+m;
}
function minutesToTime(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  return `${pad(Math.floor(mins/60))}:${pad(mins%60)}`;
}
function addMinutesToTime(timeStr, mins){
  return minutesToTime(timeToMinutes(timeStr) + mins);
}

function populateDurationSelect(){
  const sel = document.getElementById('fDuration');
  let html = '';
  for(let m = 5; m <= 60; m += 5){
    html += `<option value="${m}" ${m===DEFAULT_DURATION ? 'selected' : ''}>${m} min</option>`;
  }
  sel.innerHTML = html;
  sel.value = DEFAULT_DURATION;
}

// Pegá acá la URL que te da Google Apps Script al implementar como "Aplicación web".
// Tiene esta forma: https://script.google.com/macros/s/AKfycb.../exec
const AGENDA_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwjOlYQbqy-dv2QuUSufE_P_eTkpG4JSJjr-XGVx7R04auHY3l0GhOLxlSwOt-28TjmSA/exec';

function isBackendConfigured(){
  return typeof AGENDA_SCRIPT_URL === 'string' && AGENDA_SCRIPT_URL.indexOf('https://script.google.com') === 0;
}

async function apiList(){
  const res = await fetch(`${AGENDA_SCRIPT_URL}?action=list`);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  return data.appointments || [];
}

// Usamos text/plain como Content-Type a propósito: evita que el navegador dispare
// una request de "preflight" (OPTIONS) que Google Apps Script no responde bien.
// Apps Script igual lee el JSON crudo del body sin problema.
async function apiPost(payload){
  const res = await fetch(AGENDA_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('network');
  return res.json();
}

async function loadAppointments(){
  if(!isBackendConfigured()){
    hideInitialLoading();
    showBanner('setup', 'Todavía no conectaste la planilla: pegá la URL de tu Google Apps Script en <code>AGENDA_SCRIPT_URL</code>, dentro del archivo HTML, y volvé a abrir la página.');
    appointments = [];
    render();
    return;
  }

  setSyncing(true);
  try{
    appointments = await apiList();
    hideBanner();
    render();
    hasLoadedOnce = true;
  }catch(e){
    showBanner('error', 'No se pudo conectar con la planilla. Revisá tu conexión a internet. <button id="retryLoad" class="banner-retry">Reintentar</button>');
    document.getElementById('retryLoad').addEventListener('click', loadAppointments);
  }finally{
    setSyncing(false);
    hideInitialLoading();
  }

function editAppointment(id){
  const a = appointments.find(x => x.id === id);
  if(!a) return;
  document.getElementById('fName').value = a.name;
  document.getElementById('fDate').value = a.date;
  document.getElementById('fStart').value = a.timeStart;

  let duration = timeToMinutes(a.timeEnd) - timeToMinutes(a.timeStart);
  if(duration <= 0) duration = DEFAULT_DURATION;
  duration = Math.max(5, Math.min(60, Math.round(duration/5)*5));
  document.getElementById('fDuration').value = duration;

  document.getElementById('fNotes').value = a.notes || '';
  document.getElementById('fPhone').value = a.phone || '';
  document.getElementById('fPrice').value = a.price || '';
  document.getElementById('fCurrency').value = a.currency || 'ARS';
  editingId = id;
  document.getElementById('btnAdd').textContent = 'Guardar cambios';
  window.scrollTo({top:0, behavior:'smooth'});
}

function sortByTime(list){
  return list.slice().sort((a,b) => a.timeStart.localeCompare(b.timeStart));
}

function currencySymbol(currency){
  return currency === 'USD' ? 'US$' : '$';
}

// Formatea el teléfono para mostrarlo de forma consistente sin importar cómo
// se haya tipeado (con +, espacios, guiones, paréntesis, etc.). Si el número
// no empieza con "+", asumimos Argentina como país por defecto. Si no se
// puede reconocer como un teléfono válido, se muestra tal cual se cargó.
function formatPhoneDisplay(raw){
  if(!raw) return '';
  if(typeof libphonenumber === 'undefined') return raw; // la librería no cargó: mostramos el dato crudo
  try{
    const phoneNumber = libphonenumber.parsePhoneNumberFromString(raw, 'AR');
    if(phoneNumber && phoneNumber.isValid()){
      return phoneNumber.formatInternational();
    }
  }catch(e){ /* no es un teléfono reconocible, cae al valor original */ }
  return raw;
}

function formatPrice(value){
  const num = Number(value);
  if(isNaN(num) || value === '' || value === null) return escapeHtml(String(value));
  return num.toLocaleString('es-AR');
}

function apptRowHTML(a, isToday){
  const color = colorForName(a.name);
  const metaParts = [];
  if(a.phone) metaParts.push(`<span class="appt-meta-item">📞 ${escapeHtml(formatPhoneDisplay(a.phone))}</span>`);
  if(a.price) metaParts.push(`<span class="appt-meta-item">${currencySymbol(a.currency)}${formatPrice(a.price)}</span>`);
  if(a.notes) metaParts.push(`<span class="appt-meta-item appt-meta-notes">${escapeHtml(a.notes)}</span>`);

  return `
    <div class="appt-row ${isToday ? 'is-today' : ''}" style="border-left-color:${color.bg}">
      <div class="appt-row-top">
        <div class="appt-time">${a.timeStart}–${a.timeEnd}</div>
        <div class="appt-name">
          <span class="appt-dot" style="background:${color.bg}"></span>
          ${escapeHtml(a.name)}
          ${a._overlap ? '<span class="appt-warn">⚠ superpuesto</span>' : ''}
        </div>
        <div class="appt-actions">
          <button class="icon-btn" onclick="editAppointment('${a.id}')" title="Editar">✎</button>
          <button class="icon-btn" onclick="deleteAppointment('${a.id}')" title="Eliminar">✕</button>
        </div>
      </div>
      ${metaParts.length ? `<div class="appt-row-bottom">${metaParts.join('')}</div>` : ''}
    </div>`;
}

async function addAppointment(){
  if(!isBackendConfigured()){
    showBanner('setup', 'Todavía no conectaste la planilla: pegá la URL de tu Google Apps Script en <code>AGENDA_SCRIPT_URL</code>, dentro del archivo HTML, y volvé a abrir la página.');
    return;
  }

  const name = document.getElementById('fName').value.trim();
  const date = document.getElementById('fDate').value;
  const timeStart = document.getElementById('fStart').value;
  const duration = parseInt(document.getElementById('fDuration').value, 10);
  const phone = document.getElementById('fPhone').value.trim();
  const price = document.getElementById('fPrice').value.trim();
  const currency = document.getElementById('fCurrency').value;
  const notes = document.getElementById('fNotes').value.trim();
  const msg = document.getElementById('formMsg');

  if(!name || !date || !timeStart || !duration){
    msg.textContent = 'Completá nombre, día, hora de inicio y duración.';
    msg.style.color = '#B0432E';
    return;
  }

  const timeEnd = addMinutesToTime(timeStart, duration);
  const overlaps = findOverlaps(date, timeStart, timeEnd, editingId);
  const btn = document.getElementById('btnAdd');
  const wasEditing = editingId;

  btn.disabled = true;
  msg.style.color = 'var(--ink-soft)';
  msg.textContent = 'Guardando...';

  try{
    if(wasEditing){
      await apiPost({ action:'update', appointment:{ id: wasEditing, name, date, timeStart, timeEnd, phone, price, currency, notes } });
      editingId = null;
      btn.textContent = 'Agregar turno';
    } else {
      await apiPost({ action:'create', appointment:{ name, date, timeStart, timeEnd, phone, price, currency, notes } });
    }
    await loadAppointments();

    document.getElementById('fName').value = '';
    document.getElementById('fPhone').value = '';
    document.getElementById('fPrice').value = '';
    document.getElementById('fCurrency').value = 'ARS';
    document.getElementById('fNotes').value = '';
    document.getElementById('fDuration').value = DEFAULT_DURATION;

    if(overlaps.length){
      const names = overlaps.map(o => `${o.name} (${o.timeStart}–${o.timeEnd})`).join(', ');
      msg.style.color = '#B0432E';
      msg.textContent = `Turno guardado, pero se superpone con: ${names}.`;
    } else {
      msg.style.color = 'var(--teal-deep)';
      msg.textContent = 'Turno guardado.';
      setTimeout(()=>{ msg.textContent=''; }, 2200);
    }
  }catch(e){
    msg.style.color = '#B0432E';
    msg.textContent = 'No se pudo guardar. Revisá tu conexión a internet e intentá de nuevo.';
  }finally{
    btn.disabled = false;
  }
}

async function deleteAppointment(id){
  if(!confirm('¿Eliminar este turno? Esta acción no se puede deshacer.')) return;
  try{
    await apiPost({ action:'delete', id });
    await loadAppointments();
  }catch(e){
    alert('No se pudo eliminar. Revisá tu conexión a internet e intentá de nuevo.');
  }
}

let statsMonthOffset = 0; // 0 = current month

function getStatsMonthDate(){
  const base = new Date();
  base.setDate(1); // evita desbordes al sumar/restar meses
  base.setMonth(base.getMonth() + statsMonthOffset);
  return base;
}

function computeStatsForMonth(year, month0){
  const monthAppts = appointments.filter(a => {
    const d = parseLocalDate(a.date);
    return d.getFullYear() === year && d.getMonth() === month0;
  });

  const uniquePatients = new Set(monthAppts.map(a => a.name.trim().toLowerCase())).size;

  const priced = c => monthAppts.filter(a => (a.currency || 'ARS') === c && a.price !== '' && a.price != null && !isNaN(Number(a.price)));
  const arsAppts = priced('ARS');
  const usdAppts = priced('USD');
  const sum = list => list.reduce((s,a) => s + Number(a.price), 0);
  const arsTotal = sum(arsAppts);
  const usdTotal = sum(usdAppts);

  const byWeekday = [0,0,0,0,0,0,0]; // índice según DIAS: 0=domingo … 6=sábado
  monthAppts.forEach(a => { byWeekday[parseLocalDate(a.date).getDay()]++; });

  return {
    totalTurnos: monthAppts.length,
    uniquePatients,
    arsTotal, usdTotal,
    arsCount: arsAppts.length, usdCount: usdAppts.length,
    arsAvg: arsAppts.length ? arsTotal / arsAppts.length : 0,
    usdAvg: usdAppts.length ? usdTotal / usdAppts.length : 0,
    byWeekday
  };
}

function computeAllTimeStats(){
  const uniquePatients = new Set(appointments.map(a => a.name.trim().toLowerCase())).size;
  const priced = c => appointments.filter(a => (a.currency || 'ARS') === c && a.price !== '' && a.price != null && !isNaN(Number(a.price)));
  const arsTotal = priced('ARS').reduce((s,a) => s + Number(a.price), 0);
  const usdTotal = priced('USD').reduce((s,a) => s + Number(a.price), 0);
  return { totalTurnos: appointments.length, uniquePatients, arsTotal, usdTotal };
}

function statCardHTML(label, value, accent){
  return `
    <div class="stat-card" ${accent ? `style="border-top-color:${accent}"` : ''}>
      <div class="stat-value">${value}</div>

}

function renderEstadisticas(){
  const monthDate = getStatsMonthDate();

  const month0 = monthDate.getMonth();
  document.getElementById('statsMonthLabel').textContent =

  const maxWeekday = Math.max(1, ...s.byWeekday);

      <span class="wd-count">${s.byWeekday[i]}</span>

  document.getElementById('statsContent').innerHTML = `

      ${statCardHTML('Facturado en $', s.arsCount ? '$' + formatPrice(Math.round(s.arsTotal)) : '—', '#3F6357')}
      ${statCardHTML('Facturado en US$', s.usdCount ? 'US$' + formatPrice(Math.round(s.usdTotal)) : '—', '#4C7A94')}
      ${statCardHTML('Ticket promedio $', s.arsCount ? '$' + formatPrice(Math.round(s.arsAvg)) : '—')}
      ${statCardHTML('Ticket promedio US$', s.usdCount ? 'US$' + formatPrice(s.usdAvg.toFixed(2)) : '—')}

    <div class="card" style="margin-top:20px;">

      <div class="stats-grid stats-grid-compact">
        ${statCardHTML('Turnos cargados', all.totalTurnos)}
        ${statCardHTML('Pacientes distintos', all.uniquePatients)}
        ${statCardHTML('Total en $', all.arsTotal ? '$' + formatPrice(Math.round(all.arsTotal)) : '—')}
        ${statCardHTML('Total en US$', all.usdTotal ? 'US$' + formatPrice(Math.round(all.usdTotal)) : '—')}
      </div>
    </div>`;
}

function getMondayOfWeek(offset){
  const now = new Date();
  now.setHours(0,0,0,0);
  const day = now.getDay(); // 0 = sunday
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday + offset*7);
  return monday;
}

const START_HOUR = 8;
const END_HOUR = 21; // grid covers 08:00–21:00
const ROW_H = 52; // px per hour, must match CSS visual rhythm

function timeToMinutesFromStart(timeStr){
  const [h,m] = timeStr.split(':').map(Number);
  return (h*60+m) - START_HOUR*60;
}

function renderSemana(){
  const monday = getMondayOfWeek(weekOffset);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate()+6);
  const t = todayStr();
  const totalHours = END_HOUR - START_HOUR;
  const colHeight = totalHours * ROW_H;

  document.getElementById('weekRange').textContent =
    `${monday.getDate()} ${MESES[monday.getMonth()].slice(0,3)} — ${sunday.getDate()} ${MESES[sunday.getMonth()].slice(0,3)}`;

  // corner cell
  let html = `<div class="tt-corner"></div>`;

  // day headers
  const dayDates = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const dStr = toDateStr(d);
    dayDates.push(dStr);
    const isToday = dStr === t;
    html += `
      <div class="tt-day-head ${isToday ? 'is-today' : ''}">
        <div class="dname">${DIAS_CORTOS[d.getDay()]}</div>
        <div class="dnum">${d.getDate()}</div>
      </div>`;
  }

  // hour label column
  html += `<div class="tt-hour-col" style="height:${colHeight}px">`;
  for(let h = START_HOUR; h <= END_HOUR; h++){
    html += `<div class="tt-hour-label" style="top:${(h-START_HOUR)*ROW_H}px">${pad(h)}:00</div>`;
  }
  html += `</div>`;

  // day columns
  const now = new Date();
  const nowMinutesFromStart = timeToMinutesFromStart(`${pad(now.getHours())}:${pad(now.getMinutes())}`);

  dayDates.forEach(dStr => {
    const isToday = dStr === t;
    const list = appointments.filter(a => a.date === dStr);
    const layout = layoutDayAppointments(list);
    let blocksHtml = '';

    layout.forEach(({appt: a, col, colsInCluster}) => {
      let startMin = timeToMinutesFromStart(a.timeStart);
      let endMin = timeToMinutesFromStart(a.timeEnd);
      startMin = Math.max(0, Math.min(colHeight/ROW_H*60, startMin));
      endMin = Math.max(0, Math.min(colHeight/ROW_H*60, endMin));
      const top = (startMin/60) * ROW_H;
      const height = Math.max(18, ((endMin-startMin)/60) * ROW_H - 2);
      const color = colorForName(a.name);
      const gap = 3;
      const colWidthPct = 100 / colsInCluster;
      const leftPct = col * colWidthPct;
      const hasOverlap = colsInCluster > 1;
      const tooltipParts = [`${a.timeStart}–${a.timeEnd}`, a.name];
      if(a.phone) tooltipParts.push(`Tel: ${formatPhoneDisplay(a.phone)}`);
      if(a.price) tooltipParts.push(`${currencySymbol(a.currency)}${formatPrice(a.price)}`);
      const tooltip = tooltipParts.join(' · ');
      blocksHtml += `
        <div class="tt-appt ${isToday ? 'is-today' : ''} ${hasOverlap ? 'tt-overlap' : ''}"
             style="top:${top}px;height:${height}px;left:calc(${leftPct}% + ${gap}px);width:calc(${colWidthPct}% - ${gap*2}px);background:${color.bg};border-left-color:${color.line}"
             title="${escapeHtml(tooltip)}"
             onclick="event.stopPropagation(); editAppointment('${a.id}')">
          ${hasOverlap ? '<span class="tt-warn" title="Se superpone con otro turno">⚠</span>' : ''}
          <button class="tt-del" onclick="event.stopPropagation(); deleteAppointment('${a.id}')" title="Eliminar">✕</button>
          <div class="tt-appt-time">${a.timeStart}–${a.timeEnd}</div>
          <div class="tt-appt-name">${escapeHtml(a.name)}</div>
        </div>`;
    });

    let nowLineHtml = '';
    if(isToday && nowMinutesFromStart >= 0 && nowMinutesFromStart <= colHeight/ROW_H*60){
      nowLineHtml = `<div class="tt-now-line" style="top:${(nowMinutesFromStart/60)*ROW_H}px"></div>`;
    }

    html += `
      <div class="tt-day-col ${isToday ? 'is-today' : ''}" style="height:${colHeight}px" onclick="handleSlotClick(event, '${dStr}')">
        ${nowLineHtml}
        ${blocksHtml}
      </div>`;
  });

  document.getElementById('weekTimetable').innerHTML = html;
}

function handleSlotClick(e, dateStr){
  const rect = e.currentTarget.getBoundingClientRect();
  const y = e.clientY - rect.top;
  let totalMinutes = START_HOUR*60 + (y/ROW_H)*60;
  totalMinutes = Math.round(totalMinutes/5)*5;
  totalMinutes = Math.max(START_HOUR*60, Math.min(END_HOUR*60-5, totalMinutes));
  const startStr = minutesToTime(totalMinutes);

  document.getElementById('fDate').value = dateStr;
  document.getElementById('fStart').value = startStr;
  document.getElementById('fDuration').value = DEFAULT_DURATION;
  editingId = null;
  document.getElementById('btnAdd').textContent = 'Agregar turno';
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('fName').focus();
}

  manana: 'viewManana',
  otro: 'viewOtro',
  semana: 'viewSemana',
  estadisticas: 'viewEstadisticas'
};

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view-panel').forEach(v => v.classList.add('hidden'));
    document.getElementById(VIEW_IDS[btn.dataset.view]).classList.remove('hidden');
  });
});

document.getElementById('weekPrev').addEventListener('click', () => { weekOffset--; renderSemana(); });
document.getElementById('weekNext').addEventListener('click', () => { weekOffset++; renderSemana(); });
document.getElementById('otroPrev').addEventListener('click', () => {
  const d = parseLocalDate(otroDiaDate);
  d.setDate(d.getDate()-1);
  otroDiaDate = toDateStr(d);
  renderOtroDia();
});
document.getElementById('otroNext').addEventListener('click', () => {
  const d = parseLocalDate(otroDiaDate);
  d.setDate(d.getDate()+1);
  otroDiaDate = toDateStr(d);
  renderOtroDia();
});
document.getElementById('otroDatePicker').addEventListener('change', (e) => {
  if(e.target.value){ otroDiaDate = e.target.value; renderOtroDia(); }
});
document.getElementById('statsPrev').addEventListener('click', () => { statsMonthOffset--; renderEstadisticas(); });
document.getElementById('statsNext').addEventListener('click', () => { statsMonthOffset++; renderEstadisticas(); });
document.getElementById('btnAdd').addEventListener('click', addAppointment);
document.getElementById('btnRefresh').addEventListener('click', loadAppointments);
document.getElementById('fDate').value = todayStr();
populateDurationSelect();

// Vuelve a pedir los datos a la planilla al volver a la pestaña, y cada 60s,
// para que los cambios hechos desde otro dispositivo aparezcan sin recargar a mano.
window.addEventListener('focus', loadAppointments);
setInterval(loadAppointments, 60000);

loadAppointments();
</script>

</body>
</html>
